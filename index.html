<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nourished × Apollo demos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Lora:ital@1&display=swap">
<style>
:root{--navy:#1E2C48;--ink:#3D4E70;--muted:#6E7C99;--rule:#D4DBE8;--bg:#F5F7FB;--card:#fff;--accent:#D9481F}
@media (prefers-color-scheme: dark){:root{--navy:#D3DBEA;--ink:#B9C3D7;--muted:#8B97B0;--rule:#2C3854;--bg:#0A101E;--card:#111A2D;--accent:#FF8A6E}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;padding:40px 16px}
main{max-width:640px;margin:0 auto}
.eye{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
h1{font-size:30px;line-height:1.15;color:var(--navy);margin:6px 0 4px;font-weight:800}
p.s{font-family:Lora,Georgia,serif;font-style:italic;font-size:16px;margin:0 0 24px}
a.c{display:block;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-bottom:12px;text-decoration:none;color:var(--ink)}
a.c b{display:block;font-size:18px;color:var(--navy);margin-bottom:4px}
a.c:hover,a.c:focus-visible{border-color:var(--accent);outline:none}
</style>
</head>
<body>
<main>
  <div class="eye">Nourished × Apollo</div>
  <h1>Live demos</h1>
  <p class="s">Two ways a customer finds their stack.</p>
  <a class="c" href="/formulaic"><b>Formulaic quiz</b>Thirteen quick questions point the customer to one of the ten Formulaic products.</a>
  <a class="c" href="/personalised"><b>Personalised engine</b>Bloods and answers build a seven-layer stack, then print the customer's recommendation sheet.</a>
</main>
</body>
</html>
